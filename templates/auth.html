
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeAI Security - Authentication</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --cyber-primary: #00ff9d;
            --cyber-secondary: #00d9ff;
            --cyber-accent: #ff00c8;
            --dark-bg: #0a0a14;
            --gradient-primary: linear-gradient(135deg, var(--cyber-primary), var(--cyber-secondary));
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--dark-bg); color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative;
        }
        /* Background Effects */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 255, 157, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0, 217, 255, 0.06) 0%, transparent 50%);
            z-index: -2;
        }
        .auth-container {
            width: 100%; max-width: 450px; background: rgba(15, 15, 25, 0.9);
            border-radius: 20px; padding: 40px; border: 1px solid rgba(0, 255, 157, 0.2);
            box-shadow: 0 0 40px rgba(0, 255, 157, 0.1); backdrop-filter: blur(10px);
            position: relative; overflow: hidden; z-index: 100;
        }
        .auth-container::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: var(--gradient-primary);
        }
        .auth-header { text-align: center; margin-bottom: 40px; }
        .brand {
            font-size: 2.8rem; font-weight: 900; margin-bottom: 10px;
            background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px;
        }
        .tagline { color: rgba(255, 255, 255, 0.6); font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; }
        
        .auth-tabs {
            display: flex; background: rgba(255, 255, 255, 0.05); border-radius: 12px;
            padding: 5px; margin-bottom: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tab-btn {
            flex: 1; padding: 12px 20px; background: transparent; border: none;
            color: rgba(255, 255, 255, 0.6); font-weight: 600; cursor: pointer;
            border-radius: 8px; transition: all 0.3s ease;
        }
        .tab-btn.active { background: var(--gradient-primary); color: black; box-shadow: 0 0 15px rgba(0, 255, 157, 0.3); }
        
        .auth-form { display: none; animation: fadeIn 0.5s ease; }
        .auth-form.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .form-group { margin-bottom: 20px; position: relative; }
        .input-icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: rgba(0, 255, 157, 0.5); font-size: 1.1rem; z-index: 1; margin-top: -2px;
        }
        .auth-input {
            width: 100%; padding: 15px 15px 15px 45px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 157, 0.2); border-radius: 10px; color: white;
            font-size: 1rem; transition: all 0.3s ease;
        }
        .auth-input:focus { outline: none; border-color: var(--cyber-primary); box-shadow: 0 0 15px rgba(0, 255, 157, 0.2); background: rgba(255, 255, 255, 0.08); }
        
        .submit-btn {
            width: 100%; padding: 15px; background: var(--gradient-primary); border: none;
            border-radius: 10px; color: black; font-size: 1.1rem; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 255, 157, 0.4); }
        
        .alert-box {
            padding: 12px 20px; border-radius: 10px; margin-bottom: 25px; font-size: 0.9rem;
            display: flex; align-items: center; gap: 10px; animation: slideDown 0.3s ease;
        }
        .alert-error { background: rgba(255, 0, 0, 0.1); border: 1px solid rgba(255, 0, 0, 0.3); color: #ff4444; }
        .alert-success { background: rgba(0, 255, 157, 0.1); border: 1px solid rgba(0, 255, 157, 0.3); color: var(--cyber-primary); }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="brand">HomeAI</h1>
            <p class="tagline">Secure Home Monitoring Platform</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert-box alert-{{ category }}">
                        <i class="fas fa-info-circle"></i> <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <div class="auth-tabs">
            <button id="btn-login" class="tab-btn active" onclick="switchTab('login')">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
            <button id="btn-register" class="tab-btn" onclick="switchTab('register')">
                <i class="fas fa-user-plus"></i> Register
            </button>
        </div>
        
        <!-- UPDATED: url_for('login') -> url_for('auth.login') -->
        <form id="login-form" class="auth-form active" action="{{ url_for('auth.login') }}" method="POST">
             <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <span class="input-icon"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" class="auth-input" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <span class="input-icon"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" class="auth-input" placeholder="Password" required>
            </div>
            <button type="submit" class="submit-btn"><i class="fas fa-terminal"></i> ACCESS DASHBOARD</button>
        </form>
        
        <!-- UPDATED: url_for('register') -> url_for('auth.register') -->
        <form id="register-form" class="auth-form" action="{{ url_for('auth.register') }}" method="POST">
             <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <span class="input-icon"><i class="fas fa-user"></i></span>
                <input type="text" name="nama" class="auth-input" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <span class="input-icon"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" class="auth-input" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <span class="input-icon"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" class="auth-input" placeholder="Create Password" required>
            </div>
            <button type="submit" class="submit-btn"><i class="fas fa-rocket"></i> CREATE ACCOUNT</button>
        </form>
    </div>
    
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');
            
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            document.getElementById(tab + '-form').classList.add('active');
        }
        
        // OTOMATIS PINDAH KE REGISTER JIKA ADA ?mode=register DI URL
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'register') {
                switchTab('register');
            }
        });
        
        // Hilangkan alert otomatis
        setTimeout(() => {
            document.querySelectorAll('.alert-box').forEach(alert => {
                if (!alert.classList.contains('alert-error')) alert.style.display = 'none';
            });
        }, 4000);
    </script>
</body>
</html>
