{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; text-align:center;">
    <div style="font-size:6rem; color:#ff0064; margin-bottom:20px;">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h1 style="font-size:3rem; margin:0; color:white;">Error {{ code }}</h1>
    <p style="font-size:1.2rem; opacity:0.7; margin:20px 0;">{{ error }}</p>
    
    <div style="margin-top:30px;">
        <!-- UPDATED for Blueprint -->
        <a href="{{ url_for('main.dashboard') }}" class="cyber-btn primary">
            <i class="fas fa-home"></i> Kembali ke Dashboard
        </a>
    </div>
</div>
{% endblock %}
